<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Opaque sandbox iframe: list hosts explicitly ('self' does not match). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net http://localhost:3000 http://127.0.0.1:3000 http://localhost:8080 http://127.0.0.1:8080; connect-src http://localhost:8080 http://127.0.0.1:8080 https://cdn.jsdelivr.net; img-src http://localhost:3000 http://127.0.0.1:3000 http://localhost:8080 http://127.0.0.1:8080 data: blob:; style-src 'unsafe-inline';"
    />
    <title>Cyborg Playframe</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0b0a12;
        overflow: hidden;
      }
      #game-root {
        width: 100%;
        height: 100%;
      }
      #status {
        position: absolute;
        left: 12px;
        bottom: 10px;
        color: #8a8199;
        font: 10px monospace;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="status">WAITING FOR BOOT…</div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
    <script src="/cyborg-sdk.js"></script>
    <script>
      (function () {
        const status = document.getElementById("status");
        function setStatus(text) {
          if (status) status.textContent = text;
        }

        window.addEventListener("message", function (event) {
          const data = event.data || {};
          if (data.type !== "cyborg-boot") return;
          if (!data.scriptUrl) {
            setStatus("BOOT MISSING SCRIPT");
            return;
          }
          setStatus("LOADING " + (data.runtime || "game").toUpperCase() + "…");
          if (window.__cyborgGame) {
            try {
              window.__cyborgGame.destroy(true);
            } catch (_e) {}
            window.__cyborgGame = null;
          }
          const previous = document.querySelector("script[data-cyborg-bundle]");
          if (previous) previous.remove();
          const script = document.createElement("script");
          script.src = data.scriptUrl;
          script.async = true;
          script.dataset.cyborgBundle = "true";
          script.onload = function () {
            setStatus((data.runtime || "game").toUpperCase() + " RUNNING");
          };
          script.onerror = function () {
            setStatus("FAILED TO LOAD BUNDLE");
            if (window.parent && window.parent !== window) {
              window.parent.postMessage(
                { type: "cyborg-play-error", message: "Failed to load bundle" },
                "*",
              );
            }
          };
          document.body.appendChild(script);
        });

        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "cyborg-playframe-ready" }, "*");
        }
        setStatus("PLAYFRAME READY");
      })();
    </script>
  </body>
</html>
