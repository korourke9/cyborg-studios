services:
  db:
    image: postgres:18
    container_name: cyborg-studios-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamebuilder
      POSTGRES_USER: gamebuilder
      POSTGRES_PASSWORD: gamebuilder
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql

  temporal:
    image: temporalio/auto-setup:1.28.4
    container_name: cyborg-studios-temporal
    depends_on:
      - db
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: gamebuilder
      POSTGRES_PWD: gamebuilder
      POSTGRES_SEEDS: db
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:latest
    container_name: cyborg-studios-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

  backend:
    build:
      context: ./backend
    container_name: cyborg-studios-backend
    depends_on:
      - db
      - temporal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://gamebuilder:gamebuilder@db:5432/gamebuilder
      TEMPORAL_TARGET: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: game-generation
      PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080}
      ASSET_STORAGE_DIR: /app/data/assets
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-true}
      DESIGN_AGENT_MODE: ${DESIGN_AGENT_MODE:-auto}
      STORY_AGENT_MODE: ${STORY_AGENT_MODE:-auto}
      ART_AGENT_MODE: ${ART_AGENT_MODE:-auto}
      ENGINEERING_AGENT_MODE: ${ENGINEERING_AGENT_MODE:-auto}
      QA_AGENT_MODE: ${QA_AGENT_MODE:-auto}
      PRODUCER_AGENT_MODE: ${PRODUCER_AGENT_MODE:-auto}
      LLM_MODEL_DESIGN: ${LLM_MODEL_DESIGN:-}
      LLM_MODEL_WRITING: ${LLM_MODEL_WRITING:-}
      LLM_MODEL_ART: ${LLM_MODEL_ART:-}
      LLM_MODEL_ENGINEERING: ${LLM_MODEL_ENGINEERING:-}
      LLM_MODEL_QA: ${LLM_MODEL_QA:-}
      LLM_MODEL_PRODUCER: ${LLM_MODEL_PRODUCER:-}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-none}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://host.docker.internal:7860}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      IMAGE_SIZE: ${IMAGE_SIZE:-512x512}
      IMAGE_SOFT_FAIL: ${IMAGE_SOFT_FAIL:-true}
      ENGINEERING_SDK_ENABLED: ${ENGINEERING_SDK_ENABLED:-true}
      ENGINEERING_SDK_LLM_REVIEW: ${ENGINEERING_SDK_LLM_REVIEW:-true}
      ENGINEERING_SDK_LLM_AUTHORSHIP: ${ENGINEERING_SDK_LLM_AUTHORSHIP:-true}
    ports:
      - "8080:8080"
    volumes:
      - asset_data:/app/data/assets

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    container_name: cyborg-studios-frontend
    depends_on:
      - backend
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  db_data:
  asset_data:
