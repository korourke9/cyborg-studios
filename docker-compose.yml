services:
  db:
    image: postgres:18
    container_name: cyborg-studios-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamebuilder
      POSTGRES_USER: gamebuilder
      POSTGRES_PASSWORD: gamebuilder
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql

  temporal:
    image: temporalio/auto-setup:1.28.4
    container_name: cyborg-studios-temporal
    depends_on:
      - db
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: gamebuilder
      POSTGRES_PWD: gamebuilder
      POSTGRES_SEEDS: db
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:latest
    container_name: cyborg-studios-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

  backend:
    build:
      context: ./backend
    container_name: cyborg-studios-backend
    depends_on:
      - db
      - temporal
    environment:
      DATABASE_URL: postgresql+asyncpg://gamebuilder:gamebuilder@db:5432/gamebuilder
      TEMPORAL_TARGET: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: game-generation
      PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-true}
      DESIGN_AGENT_MODE: ${DESIGN_AGENT_MODE:-auto}
      LLM_MODEL_DESIGN: ${LLM_MODEL_DESIGN:-gpt-4o-mini}
      LLM_MODEL_PRODUCER: ${LLM_MODEL_PRODUCER:-gpt-4o-mini}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    container_name: cyborg-studios-frontend
    depends_on:
      - backend
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  db_data:
