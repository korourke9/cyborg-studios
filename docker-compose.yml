version: "3.9"

services:
  db:
    image: postgres:18
    container_name: cyborg-studios-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamebuilder
      POSTGRES_USER: gamebuilder
      POSTGRES_PASSWORD: gamebuilder
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql

  backend:
    build:
      context: ./backend
    container_name: cyborg-studios-backend
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/gamebuilder
      DB_USERNAME: gamebuilder
      DB_PASSWORD: gamebuilder
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  db_data:

