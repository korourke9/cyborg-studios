version: "3.9"

services:
  db:
    image: postgres:18
    container_name: cyborg-studios-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamebuilder
      POSTGRES_USER: gamebuilder
      POSTGRES_PASSWORD: gamebuilder
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql

  backend:
    build:
      context: ./backend
    container_name: cyborg-studios-backend
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/gamebuilder
      DB_USERNAME: gamebuilder
      DB_PASSWORD: gamebuilder
      PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_BASE_URL: http://localhost:8080
    container_name: cyborg-studios-frontend
    depends_on:
      - backend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  db_data:

