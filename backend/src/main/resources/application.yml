spring:
  application:
    name: multi-agent-game-builder-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gamebuilder}
    username: ${DB_USERNAME:gamebuilder}
    password: ${DB_PASSWORD:gamebuilder}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized

